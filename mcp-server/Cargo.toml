[package]
name = "mcpod"
version = "2.0.1"
edition = "2024"
description = "MCP-controlled Docker development container server"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.7"
base64 = "0.22"
futures-util = "0.3.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
libc = "0.2.177"
rmcp = { version = "3.2.0", features = ["transport-streamable-http-server", "client", "transport-streamable-http-client-reqwest"] }
schemars = "1.0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "2"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "fs", "signal", "time", "net"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
bytes = "1.12.1"
reqwest = { version = "0.13.4", features = ["json"] }
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
